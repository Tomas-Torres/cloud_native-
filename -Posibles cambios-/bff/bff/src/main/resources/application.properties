# Server configuration
server.port=8080

# Spring Application Name
spring.application.name=bff-gateway

# URLs de los microservicios
microservices.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}
microservices.productos.url=${MS_PRODUCTOS_URL:http://localhost:8082}
microservices.bodega.url=${MS_BODEGA_URL:http://localhost:8083}
microservices.carrito.url=${MS_CARRITO_URL:http://localhost:8084}
microservices.delivery.url=${MS_DELIVERY_URL:http://localhost:8085}
microservices.pagos.url=${MS_PAGOS_URL:http://localhost:8086}

# Management / Actuator
management.endpoints.web.exposure.include=health,info