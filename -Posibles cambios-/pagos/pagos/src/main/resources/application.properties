# Server configuration
server.port=8086

# Spring Application
spring.application.name=pagos

# Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_pagos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=Benja*2803*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Mercado Pago configuration
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:TEST-ACCESS-TOKEN}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8086/api/pagos/notifications}

# Actuator / Management Endpoints
management.endpoints.web.exposure.include=health,info

# Habilitar la interfaz de Swagger
springdoc.swagger-ui.enabled=true
# Definir la ruta personalizada (opcional, pero ayuda a que no se pierda)
springdoc.swagger-ui.path=/swagger-ui.html